{% extends 'base.html' %}
{% block content %}
<style>
  /* 전체 페이지 스타일: 검정 배경으로 몰입감 유도 */
  .printing-page {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #000; color: #fff; overflow: hidden;
  }

  .header-area { text-align: center; margin-bottom: 30px; z-index: 100; }
  .header-area h1 { margin: 0; font-size: 32px; color: #00d1b2; text-shadow: 0 0 10px rgba(0,209,178,0.5); }
  .header-area p { margin: 10px 0 0; font-size: 18px; color: #ccc; }

  /* 무빙 포토 컨테이너 */
  #moving-photo-wrap {
    position: relative; 
    box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
    background: #222; /* 로딩 전 배경 */
  }

  /* === [핵심] 레이어 순서 정의 === */
  /* Z-Index가 낮을수록 뒤에 깔립니다. */
  
  /* 1층: 동영상 (가장 뒤) */
  .layer-video {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1; 
  }
  
  .slot-vid {
    position: absolute;
    object-fit: cover;
    transform: scaleX(-1); /* 거울 모드 (좌우반전) */
    background: #000;
  }

  /* 2층: 테마 프레임 (동영상 위) 
     프레임 이미지의 사진 들어갈 부분이 '투명'해야 뒤의 비디오가 보입니다. */
  .layer-frame {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10; 
    pointer-events: none; /* 클릭 통과 */
  }
  .layer-frame img { 
    width: 100%; height: 100%; 
    object-fit: fill; display: block; 
  }

  /* 3층: 스티커 (맨 위) */
  .layer-sticker {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20; pointer-events: none;
  }
  .sticker-item { position: absolute; display: block; }

  /* 로딩 애니메이션 */
  .loading-dots { display: flex; gap: 10px; margin-top: 30px; }
  .dot { width: 12px; height: 12px; background: #fff; border-radius: 50%; animation: blink 1.4s infinite both; }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes blink { 
    0%, 80%, 100% { transform: scale(0); } 
    40% { transform: scale(1); } 
  }

  /* 수동 홈 버튼 (오래 걸릴 때 사용) */
  .home-btn {
    margin-top: 30px;
    padding: 10px 20px;
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 5px;
    cursor: pointer;
    opacity: 0; 
    transition: opacity 1s;
  }
</style>

<div class="printing-page">
  <div class="header-area">
    <h1>인쇄 중입니다...</h1>
    <p>사진이 출력되는 동안 화면을 감상해주세요.</p>
  </div>

  <div id="moving-photo-wrap">
    <div id="videoLayer" class="layer-video"></div>

    <div class="layer-frame">
      <img src="{{ frame_url }}" alt="frame" onerror="console.error('프레임 로드 실패')">
    </div>

    <div id="stickerLayer" class="layer-sticker"></div>
  </div>

  <div class="loading-dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  
  <button class="home-btn" id="manualHomeBtn" onclick="goHome()">처음으로</button>
</div>

<script>
// Django Views에서 전달받은 데이터
const meta = {{ meta_json|safe }};
const stickers = {{ stickers_json|safe }};
const videoUrls = {{ mapped_videos_json|safe }}; // views.py에서 전달한 비디오 경로 리스트
const printDurationSec = {{ print_duration|default:60 }}; // 관리자 설정 시간 (기본 60초)

const container = document.getElementById('moving-photo-wrap');
const videoLayer = document.getElementById('videoLayer');
const stickerLayer = document.getElementById('stickerLayer');

function init(){
  if(!meta || !meta.canvas) return;

  // 화면 크기 반응형 조절 (화면 높이의 65% 기준)
  const cw = meta.canvas.width;
  const ch = meta.canvas.height;
  const maxHeight = window.innerHeight * 0.65; 
  const scale = maxHeight / ch;
  
  const finalW = cw * scale;
  const finalH = ch * scale;

  container.style.width = finalW + 'px';
  container.style.height = finalH + 'px';

  // 1. 비디오 배치 (개별 파일 재생)
  const slots = meta.slots || [];
  slots.forEach((slot, idx)=>{
    const url = videoUrls[idx];
    if(url){
      const v = document.createElement('video');
      v.src = url; 
      v.className = 'slot-vid';
      
      // 자동 재생을 위한 필수 속성들
      v.autoplay = true; 
      v.loop = true; 
      v.muted = true; 
      v.playsInline = true;
      
      // 위치 및 크기 설정
      v.style.left = (slot.x * scale) + 'px';
      v.style.top = (slot.y * scale) + 'px';
      v.style.width = (slot.w * scale) + 'px';
      v.style.height = (slot.h * scale) + 'px';
      
      videoLayer.appendChild(v);
      
      // 브라우저 정책으로 자동 재생 막힘 방지용
      v.play().catch(e => console.log("Auto-play prevented", e));
    }
  });

  // 2. 스티커 배치
  if(stickers) {
      stickers.forEach(st => {
        const img = document.createElement('img');
        img.className = 'sticker-item';
        img.src = `/static/frames/stickers/${st.id}.png`;
        img.style.left = (st.x * scale) + 'px';
        img.style.top = (st.y * scale) + 'px';
        img.style.width = (st.w * scale) + 'px';
        img.style.height = (st.h * scale) + 'px';
        img.style.transform = `rotate(${st.angle}deg)`;
        stickerLayer.appendChild(img);
      });
  }

  // 서버에 인쇄 요청 전송
  triggerServerPrint();
}

function triggerServerPrint() {
    // views.py의 print_action 호출
    fetch("{% url 'print_action' %}", {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({'action': 'print_now'})
    })
    .then(r => r.json())
    .then(data => {
        console.log("Print Status:", data.message);
    })
    .catch(err => console.error(err));
}

function goHome() {
    window.location.href = "{% url 'startpage' %}";
}

window.addEventListener('load', init);

// 관리자에서 설정한 시간 후 자동 이동
setTimeout(()=>{
  goHome();
}, printDurationSec * 1000); 

// 10초 뒤 수동 홈 버튼 표시 (혹시 모를 상황 대비)
setTimeout(()=>{
    document.getElementById('manualHomeBtn').style.opacity = 1;
}, 10000);
</script>
{% endblock %}
