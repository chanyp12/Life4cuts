{% extends 'base.html' %}
{% block content %}
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background-color: #1a1a1a;
  }
  .theme-page {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 40px; box-sizing: border-box;
    overflow: hidden;
  }
  .theme-header { flex: 0 0 auto; margin-bottom: 30px; text-align: center; }
  .theme-header h1 { margin: 0; font-size: 36px; color: #fff; }
  .theme-header p { margin: 10px 0 0; font-size: 18px; color: #aaa; }

  /* 테마 목록 그리드 */
  .theme-grid {
    flex: 1; 
    overflow-y: auto;
    display: flex; /* Flex로 변경하여 중앙 정렬 용이하게 */
    flex-wrap: wrap;
    justify-content: center;
    gap: 40px; /* 간격 넓힘 */
    padding-bottom: 40px;
  }
  .theme-grid::-webkit-scrollbar { width: 8px; }
  .theme-grid::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

  .theme-card {
    background: #000;
    border: 4px solid #333; /* 테두리 두껍게 */
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; flex-direction: column;
    
    /* [수정] 카드 크기를 화면 높이의 60% 정도로 설정하여 비율 유지 */
    height: 60vh; 
    /* 4컷 비율(1:3 ~ 1:4)에 맞춰 너비 자동 설정 */
    aspect-ratio: 1 / 3; 
    
    box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  }
  .theme-card:hover {
    border-color: #00d1b2;
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 15px 30px rgba(0, 209, 178, 0.4);
  }
  
  .theme-thumb {
    flex: 1; /* 남은 공간 모두 이미지로 채움 */
    width: 100%;
    height: 100%;
    object-fit: fill; /* 이미지를 프레임에 꽉 채움 (비율 깨짐 방지 위해 contain 대신 fill 사용하되 원본 비율이 맞아야 함) */
    background: #111;
    display: block;
  }
  
  .theme-name {
    padding: 20px;
    font-size: 20px;
    color: #fff;
    text-align: center;
    background: #222;
    font-weight: bold;
    border-top: 1px solid #333;
    flex: 0 0 auto;
  }

  .empty-msg {
    color: #888; text-align: center; margin-top: 80px; width: 100%; font-size: 18px;
  }
</style>

<div class="theme-page">
  <div class="theme-header">
    <h1>테마 선택</h1>
    <p>{{ count }}컷 프레임 디자인을 선택해주세요.</p>
  </div>

  <div class="theme-grid">
    {% for theme in themes %}
      <div class="theme-card" onclick="location.href='{% url 'camera' %}?theme={{ theme.name }}'">
        <img src="{{ theme.thumb }}" alt="{{ theme.name }}" class="theme-thumb">
        <div class="theme-name">{{ theme.name }}</div>
      </div>
    {% empty %}
      <div class="empty-msg">
        <p>⚠️ 등록된 테마가 없습니다.</p>
        <p style="font-size:14px; margin-top:12px; line-height: 1.6; color: #aaa;">
          아래 경로 확인: <span style="color:#ffd54f;">{{ debug_path }}</span>
        </p>
      </div>
    {% endfor %}
  </div>

  <div style="flex:0 0 auto; margin-top:20px; text-align: center;">
    <button onclick="history.back()" style="padding:15px 40px; border-radius:10px; border:none; background:#555; color:white; cursor:pointer; font-size: 18px; font-weight: bold;">뒤로가기</button>
  </div>
</div>
{% endblock %}
