{% extends 'base.html' %}
{% block content %}
<style>
  .theme-page{
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px;
    box-sizing: border-box;
  }

  .theme-header{
    margin-bottom: 8px;
  }

  .theme-header-top{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .back-btn{
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid #555;
    background: #222;
    color: #fff;
    cursor: pointer;
  }
  .back-btn:hover{
    background: #333;
  }

  /* 프레임 리스트: 좌우 스크롤 */
  .theme-list-wrap{
    flex: 1;
    display: flex;
    align-items: center;
    min-height: 0;
    overflow-x: auto;
    overflow-y: hidden;
    gap: 24px;
    padding: 8px 4px;
  }

  .theme-card{
    flex: 0 0 auto;
    background: #111;
    border-radius: 18px;
    padding: 12px 12px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
    transition: transform .15s, box-shadow .15s, border-color .15s;
    border: 2px solid transparent;
  }
  .theme-card:hover{
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 4px 12px rgba(0,0,0,.7);
    border-color: #00d1b2;
  }

  .theme-card-img-wrap{
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .theme-card-img-wrap img{
    height: 60vh;          /* 세로로 크게 */
    width: auto;
    max-width: 260px;
    object-fit: contain;   /* 비율 유지 */
    display: block;
    background: #000;
    border-radius: 10px;
  }

  .theme-card-body{
    margin-top: 8px;
    font-weight: 700;
    font-size: 14px;
  }
</style>

<div class="theme-page">
  <div class="theme-header">
    <div class="theme-header-top">
      <div>
        <h1>{{ count }}장 테마 선택</h1>
        <p style="font-size:13px;opacity:.8">
          사용할 프레임 테마를 선택하세요. 좌우로 스크롤해서 더 많은 프레임을 볼 수 있습니다.
        </p>
      </div>

      <!-- 이전 페이지(촬영 장수 선택)로 돌아가기 -->
      <button type="button" class="back-btn"
              onclick="location.href='{% url 'select_shot' %}'">
        ← 이전 단계
      </button>
    </div>
  </div>

  <div class="theme-list-wrap">
    {% for t in themes %}
      <div class="theme-card"
           onclick="location.href='{% url 'camera' %}?count={{count}}&theme={{t.name}}'">
        <div class="theme-card-img-wrap">
          <img src="{{ t.thumb }}" alt="{{ t.name }}">
        </div>
        <div class="theme-card-body">{{ t.name }}</div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
