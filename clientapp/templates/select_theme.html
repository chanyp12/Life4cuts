{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
    .page-container {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: 100%; height: 100vh;
        background-color: #000; color: #fff;
    }
    
    .header-area { text-align: center; margin-bottom: 50px; }
    .header-area h1 { font-size: 32px; margin-bottom: 10px; }
    .header-area p { color: #888; font-size: 16px; }

    /* 카드 리스트 스타일 (select_shot과 통일) */
    .card-list {
        display: flex; gap: 40px; justify-content: center;
    }
    
    .theme-card {
        background: #111;
        border: 2px solid #333;
        border-radius: 20px;
        padding: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
        width: 280px;
    }
    
    .theme-card:hover {
        border-color: #00d1b2;
        transform: translateY(-10px);
        box-shadow: 0 10px 30px rgba(0, 209, 178, 0.2);
    }
    
    .theme-thumb {
        width: 100%; height: auto;
        border-radius: 10px;
        margin-bottom: 20px;
        display: block;
    }
    
    .theme-name {
        font-size: 18px; font-weight: bold; color: #fff;
        text-transform: uppercase;
    }

    .btn-back {
        margin-top: 60px; padding: 12px 30px;
        background: #333; color: white; border: none; border-radius: 8px;
        cursor: pointer; font-size: 16px;
    }
    .btn-back:hover { background: #444; }
</style>

<div class="page-container">
    <div class="header-area">
        <h1>테마 선택</h1>
        <p>원하는 프레임 디자인을 선택해주세요.</p>
    </div>

    <div class="card-list">
        {% for t in themes %}
        <div class="theme-card" onclick="selectTheme('{{ t.name }}')">
            <img src="{{ t.thumb }}" class="theme-thumb">
            <div class="theme-name">{{ t.name }}</div>
        </div>
        {% empty %}
        <p>표시할 테마가 없습니다.</p>
        {% endfor %}
    </div>

    <button class="btn-back" onclick="history.back()">뒤로가기</button>
</div>

<script>
function selectTheme(themeName) {
    location.href = "{% url 'camera' %}?theme=" + themeName;
}
</script>
{% endblock %}
