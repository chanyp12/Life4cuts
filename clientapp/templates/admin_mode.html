{% extends 'base.html' %}
{% block content %}
<style>
    /* 기본 레이아웃 */
    body { background: #222; color: #fff; overflow: hidden; margin: 0; }
    .admin-container { display: flex; height: 100vh; }
    
    /* === [보안] 잠금 화면 === */
    #lock-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
        z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .numpad-container {
        background: #333; padding: 30px; border-radius: 20px;
        box-shadow: 0 10px 50px rgba(0,0,0,0.8); text-align: center; width: 320px; border: 2px solid #555;
    }
    .numpad-display {
        width: 100%; height: 60px; margin-bottom: 20px; font-size: 32px;
        text-align: center; letter-spacing: 8px; background: #222; color: #00d1b2;
        border: 2px solid #444; border-radius: 10px; font-weight: bold;
    }
    .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .num-btn {
        padding: 20px; font-size: 22px; font-weight: bold; background: #444; border: none;
        border-radius: 12px; color: #fff; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 0 #222;
    }
    .num-btn:active { transform: translateY(4px); box-shadow: none; }
    .btn-clear { background: #c0392b; }
    .btn-enter { background: #27ae60; }

    /* === 관리자 UI === */
    .preview-area {
        flex: 3; background: #111; display: flex; flex-direction: column;
        align-items: center; justify-content: center; position: relative; user-select: none;
    }
    
    #canvas-wrap {
        position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.5); background-color: #333;
    }
    
    /* 드래그 가능한 슬롯 박스 */
    .slot-box {
        position: absolute;
        border: 2px solid #00ff00; background: rgba(0, 255, 0, 0.3);
        z-index: 100; color: #fff; font-weight: bold; font-size: 24px;
        display: flex; align-items: center; justify-content: center;
        text-shadow: 0 0 5px #000; cursor: grab;
    }
    .slot-box:active { cursor: grabbing; border-color: #fff; }
    
    .frame-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

    .control-panel {
        flex: 1; min-width: 380px; background: #333; padding: 20px; overflow-y: auto;
        box-shadow: -5px 0 10px rgba(0,0,0,0.3);
    }
    .control-group { background: #444; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .control-group h3 { margin-top: 0; border-bottom: 1px solid #555; padding-bottom: 10px; font-size: 18px; color: #eee; }

    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #ccc; }
    input[type="number"], input[type="text"], select {
        width: 100%; padding: 8px; margin-bottom: 10px; background: #555; border: 1px solid #666;
        color: white; border-radius: 4px; box-sizing: border-box;
    }
    button { width: 100%; padding: 12px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; transition: 0.2s; font-size: 16px; }
    .btn-save { background: #00d1b2; color: white; }
    .btn-blue { background: #3273dc; color: white; margin-top: 10px; }
    .btn-home { background: #666; color: white; margin-bottom: 20px; }
    .btn-init { background: #e67e22; color: white; margin-bottom: 10px; }

    .slot-row {
        display: flex; align-items: center; justify-content: space-between;
        background: #333; padding: 10px; border-radius: 5px; margin-bottom: 10px;
    }
    .slot-title { font-weight: bold; color: #00d1b2; width: 50px; font-size: 14px; }
    .coord-group { display: flex; gap: 4px; }
    .coord-item { display: flex; flex-direction: column; align-items: center; }
    .coord-item span { font-size: 10px; color: #aaa; margin-bottom: 2px; }
    .coord-item input { width: 55px; padding: 4px; text-align: center; font-size: 13px; }
</style>

<div id="lock-screen">
    <div class="numpad-container">
        <h3 style="margin-top:0; color:#00d1b2;">관리자 접근</h3>
        <input type="password" id="numpad-display" class="numpad-display" readonly placeholder="----">
        <div class="numpad-grid">
            <button class="num-btn" onclick="addNum('1')">1</button>
            <button class="num-btn" onclick="addNum('2')">2</button>
            <button class="num-btn" onclick="addNum('3')">3</button>
            <button class="num-btn" onclick="addNum('4')">4</button>
            <button class="num-btn" onclick="addNum('5')">5</button>
            <button class="num-btn" onclick="addNum('6')">6</button>
            <button class="num-btn" onclick="addNum('7')">7</button>
            <button class="num-btn" onclick="addNum('8')">8</button>
            <button class="num-btn" onclick="addNum('9')">9</button>
            <button class="num-btn btn-clear" onclick="clearNum()">C</button>
            <button class="num-btn" onclick="addNum('0')">0</button>
            <button class="num-btn btn-enter" onclick="checkAuth()">OK</button>
        </div>
        <button onclick="exitAdmin()" style="margin-top:20px; background:transparent; border:1px solid #777; color:#ccc; padding:10px;">나가기</button>
    </div>
</div>

<div class="admin-container">
    <div class="preview-area" id="previewArea">
        <div id="canvas-wrap">
            <div id="slots-layer"></div>
            <img src="{{ frame_url }}" class="frame-img" onerror="alert('프레임 이미지가 없습니다.\\nstatic/frames 폴더를 확인하세요.')">
        </div>
        <p style="margin-top:10px; color:#888;">마우스로 초록색 박스를 드래그하여 위치를 조정하세요.</p>
    </div>

    <div class="control-panel">
        <h2>⚙️ 관리자 모드</h2>
        <button class="btn-home" onclick="exitAdmin()">🏠 메인 화면으로 (로그아웃)</button>

        <div class="control-group">
            <h3>🎨 테마 선택</h3>
            <form method="get">
                <label>모드 (Mode)</label>
                <select name="mode" onchange="this.form.submit()">
                    {% for m in modes %}<option value="{{ m }}" {% if mode == m %}selected{% endif %}>{{ m }}</option>{% endfor %}
                </select>
                <label>테마 (Theme)</label>
                <select name="theme" onchange="this.form.submit()">
                    {% for t in themes %}<option value="{{ t }}" {% if theme == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
                </select>
            </form>
        </div>

        <div class="control-group">
            <h3>📸 좌표 설정</h3>
            <div id="init-area" style="display:none; text-align:center; margin-bottom:10px;">
                <p style="color:#ff6b6b; font-size:14px;">설정된 슬롯이 없습니다.</p>
                <button class="btn-init" onclick="initSlots()">기본 슬롯 생성하기</button>
            </div>

            <div id="slot-controls"></div>
            
            <label style="margin-top:15px; color:#00d1b2;">촬영 간격 (초)</label>
            <input type="number" id="captureDelaySec" placeholder="예: 5">
            
            <button class="btn-save" onclick="saveSlots()">설정 저장하기</button>
        </div>

        <div class="control-group" style="border: 1px solid #00d1b2;">
            <h3 style="color:#00d1b2;">🖨️ 글로벌 설정</h3>
            <div style="display:flex; align-items:center; margin-bottom:10px;">
                <input type="checkbox" id="printerToggle" style="width:20px;" {% if global_settings.printer_enabled %}checked{% endif %}>
                <label style="margin-left:10px; cursor:pointer;" for="printerToggle">프린터 사용</label>
            </div>
            <div style="display:flex; align-items:center; margin-bottom:15px;">
                <input type="checkbox" id="mirrorToggle" style="width:20px;" {% if global_settings.mirror_mode %}checked{% endif %}>
                <label style="margin-left:10px; cursor:pointer;" for="mirrorToggle">좌우 반전</label>
            </div>
            <label>인쇄 화면 유지 시간 (초)</label>
            <input type="number" id="printDuration" value="{{ global_settings.print_duration_sec }}">
            <hr style="border-color:#555; margin:15px 0;">
            <label style="color:#ff6b6b;">관리자 비밀번호 변경</label>
            <input type="text" id="newAdminPass" value="{{ global_settings.admin_password }}" placeholder="새 비밀번호 입력">
            <button class="btn-blue" onclick="saveGlobalSettings()">글로벌 설정 저장</button>
        </div>
    </div>
</div>

<script>
// --- 데이터 로드 ---
const meta = {{ meta_json|safe }};
const captureDelayMs = {{ capture_delay_ms|default:5000 }};
const serverPassword = "{{ global_settings.admin_password|default:'1234' }}";
const MASTER_KEY = "0606";

const canvasW = meta.canvas.width || 1000;
const canvasH = meta.canvas.height || 1500;
const viewH = 800;
const scale = viewH / canvasH;
const viewW = canvasW * scale;

const wrap = document.getElementById('canvas-wrap');
const slotsLayer = document.getElementById('slots-layer');
const controlsDiv = document.getElementById('slot-controls');
const initArea = document.getElementById('init-area');

// --- 보안 로직 ---
const display = document.getElementById('numpad-display');
let currentInput = "";
function addNum(num) { if(currentInput.length < 10) { currentInput += num; display.value = "*".repeat(currentInput.length); } }
function clearNum() { currentInput = ""; display.value = ""; }
function checkAuth() {
    if (currentInput === serverPassword || currentInput === MASTER_KEY) {
        document.getElementById('lock-screen').style.display = 'none';
        sessionStorage.setItem('admin_unlocked', 'true');
    } else { alert('비밀번호가 틀렸습니다.'); clearNum(); }
}
function exitAdmin() {
    sessionStorage.removeItem('admin_unlocked');
    window.location.href = "{% url 'startpage' %}";
}
window.onload = function() {
    if (sessionStorage.getItem('admin_unlocked') !== 'true') document.getElementById('lock-screen').style.display = 'flex';
    else document.getElementById('lock-screen').style.display = 'none';
    
    renderSlots();
};

// --- UI 초기화 ---
wrap.style.width = viewW + 'px';
wrap.style.height = viewH + 'px';
document.getElementById('captureDelaySec').value = captureDelayMs / 1000;

let currentSlots = meta.slots ? JSON.parse(JSON.stringify(meta.slots)) : [];

// [기능 추가] 슬롯 초기화 (없을 때)
function initSlots() {
    const mode = "{{ mode }}";
    let count = 4;
    if(mode === '2x1') count = 2;
    else if(mode === '3x1') count = 3;

    currentSlots = [];
    for(let i=0; i<count; i++){
        currentSlots.push({x: 50, y: 50 + (i*200), w: 300, h: 200});
    }
    renderSlots();
}

// [기능 추가] 드래그 로직 변수
let isDragging = false;
let dragIdx = -1;
let startX, startY, initialX, initialY;

function renderSlots() {
    slotsLayer.innerHTML = '';
    controlsDiv.innerHTML = '';

    if (currentSlots.length === 0) {
        initArea.style.display = 'block';
        return;
    } else {
        initArea.style.display = 'none';
    }

    currentSlots.forEach((slot, idx) => {
        // 1. 박스 생성
        const div = document.createElement('div');
        div.className = 'slot-box';
        div.innerText = idx + 1;
        div.style.left = (slot.x * scale) + 'px';
        div.style.top = (slot.y * scale) + 'px';
        div.style.width = (slot.w * scale) + 'px';
        div.style.height = (slot.h * scale) + 'px';
        
        // [핵심] 드래그 이벤트 연결
        div.onmousedown = (e) => startDrag(e, idx);
        
        slotsLayer.appendChild(div);

        // 2. 입력창 생성
        const row = document.createElement('div');
        row.className = 'slot-row';
        row.innerHTML = `
            <div class="slot-title">Slot ${idx+1}</div>
            <div class="coord-group">
                <div class="coord-item"><span>X</span><input type="number" value="${slot.x}" onchange="updateSlot(${idx},'x',this.value)"></div>
                <div class="coord-item"><span>Y</span><input type="number" value="${slot.y}" onchange="updateSlot(${idx},'y',this.value)"></div>
                <div class="coord-item"><span>W</span><input type="number" value="${slot.w}" onchange="updateSlot(${idx},'w',this.value)"></div>
                <div class="coord-item"><span>H</span><input type="number" value="${slot.h}" onchange="updateSlot(${idx},'h',this.value)"></div>
            </div>`;
        controlsDiv.appendChild(row);
    });
}

// --- 드래그 핸들러 구현 ---
function startDrag(e, idx) {
    isDragging = true;
    dragIdx = idx;
    startX = e.clientX;
    startY = e.clientY;
    initialX = currentSlots[idx].x * scale;
    initialY = currentSlots[idx].y * scale;
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', stopDrag);
}

function onDrag(e) {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    
    // 화면상 좌표 -> 실제 좌표 변환
    let newX = (initialX + dx) / scale;
    let newY = (initialY + dy) / scale;
    
    currentSlots[dragIdx].x = Math.round(newX);
    currentSlots[dragIdx].y = Math.round(newY);
    
    renderSlots(); // 실시간 갱신
}

function stopDrag() {
    isDragging = false;
    dragIdx = -1;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', stopDrag);
}

function updateSlot(idx, key, val) {
    currentSlots[idx][key] = parseInt(val);
    renderSlots();
}

function saveSlots() {
    const sec = document.getElementById('captureDelaySec').value;
    const ms = sec * 1000;
    fetch("{% url 'admin_save_slots' %}", {
        method: 'POST', headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json'},
        body: JSON.stringify({mode: '{{ mode }}', theme: '{{ theme }}', slots: currentSlots, capture_delay_ms: ms})
    }).then(r=>r.json()).then(d=>alert(d.saved?'✅ 설정 저장 완료':'❌ 저장 실패'));
}

function saveGlobalSettings() {
    fetch("{% url 'admin_save_slots' %}", {
        method: 'POST', headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json'},
        body: JSON.stringify({
            action: 'save_global_settings',
            printer_enabled: document.getElementById('printerToggle').checked,
            mirror_mode: document.getElementById('mirrorToggle').checked,
            print_duration_sec: document.getElementById('printDuration').value,
            admin_password: document.getElementById('newAdminPass').value
        })
    }).then(r=>r.json()).then(d=>alert(d.saved?'✅ 글로벌 설정 저장 완료':'❌ 저장 실패'));
}
</script>
{% endblock %}
