{% extends 'base.html' %}
{% block content %}
<style>
  .start-page {
    position: relative;
    width: 100%; height: 100%;
    background-color: #000; /* 기본 검정 배경 */
    overflow: hidden;
  }

  .admin-btn {
    position: absolute; top: 24px; right: 24px; z-index: 100;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 30px;
    background: rgba(0, 0, 0, 0.5); color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    cursor: pointer;
  }
  .admin-btn svg { width: 16px; height: 16px; fill: currentColor; }

  .start-hero-wrap {
    width: 100%; height: 100%;
    padding: 0; margin: 0;
    cursor: pointer;
    display: flex; justify-content: center; align-items: center;
  }

  .hero-bg {
    position: absolute; inset: 0;
    background-color: #222; /* 이미지가 없을 때 회색 */
    background-size: cover;
    background-position: center;
    transition: transform 0.5s;
    z-index: 1;
  }
  
  /* 뷰에서 전달받은 bg_url 적용 */
  {% if bg_url %}
  .hero-bg { background-image: url('{{ bg_url }}'); }
  {% endif %}

  .start-hero-wrap:hover .hero-bg { transform: scale(1.03); }

  .start-content {
    position: relative; z-index: 10;
    text-align: center; width: 100%;
    margin-top: 40vh; /* 텍스트 위치 조정 */
  }

  .start-label {
    font-size: 60px; font-weight: 900; color: #fff;
    text-shadow: 0 4px 30px rgba(0,0,0,0.8);
    margin: 0;
  }
  .start-label::after {
    content: ''; display: block; width: 50px; height: 4px;
    background: #fff; margin: 20px auto 0;
    transition: width 0.3s;
  }
  .start-hero-wrap:hover .start-label::after { width: 150px; }
</style>

<div class="start-page">
  <button class="admin-btn" type="button" onclick="alert('관리자 모드 준비중')">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
    관리자
  </button>

  <div class="start-hero-wrap" onclick="location.href='{% url 'select_shot' %}'">
    <div class="hero-bg"></div>
    <div class="start-content">
      <h1 class="start-label">터치하여 시작</h1>
    </div>
  </div>
</div>
{% endblock %}
