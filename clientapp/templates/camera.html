{% extends 'base.html' %}
{% block content %}
<style>
  .camera-page {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #viewContainer {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  #view {
    position: relative;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: {{ guide_ratio|default:0.75 }};
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.8);
    background: #000;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: block;
  }

  .overlay-info {
    position: absolute;
    top: 40px;
    left: 0; 
    width: 100%;
    text-align: center;
    z-index: 10;
  }
  .overlay-badge {
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 20px;
    font-weight: bold;
    border: 1px solid rgba(255,255,255,0.3);
  }

  #countdown-circle {
    position: absolute;
    bottom: 50px;
    right: 50px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    border: 5px solid #ffd54f;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    opacity: 0; 
    transition: all 0.3s;
  }
  
  #countdown-number {
    color: #fff;
    font-size: 40px;
    font-weight: 800;
  }

  #countdown-circle.active {
    opacity: 1;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  #flash {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    transition: opacity 0.1s;
  }
  #flash.active {
    opacity: 1;
    transition: none;
  }

  #status-msg {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 24px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    z-index: 10;
  }
</style>

<div class="camera-page">
  <div id="viewContainer">
    <div class="overlay-info">
      <span class="overlay-badge" id="info-badge">{{ count }}컷 촬영 중</span>
    </div>

    <div id="view">
      <video id="video" autoplay playsinline muted></video>
      <div id="countdown-circle">
        <span id="countdown-number"></span>
      </div>
      <div id="flash"></div>
    </div>

    <div id="status-msg">준비 중...</div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>
  <audio id="shutterSound" src="/static/sound/shutter.mp3" preload="auto"></audio>
</div>

<script>
const SLOT_RATIO = {{ guide_ratio|default:0.75 }}; 
const SHOT_TOTAL = {{ count }};
const CAPTURE_DELAY_MS = {{ capture_delay_ms|default:5000 }};

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const countdownCircle = document.getElementById('countdown-circle');
const countdownNum = document.getElementById('countdown-number');
const statusMsg = document.getElementById('status-msg');
const infoBadge = document.getElementById('info-badge');
const flashEl = document.getElementById('flash');
const shutterSound = document.getElementById('shutterSound');

let mediaRecorder;
let recordedChunks = [];

function getCookie(name){
  let value = `; ${document.cookie}`;
  let parts = value.split(`; ${name}=`);
  if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
}
const CSRF_TOKEN = getCookie('csrftoken');

// [수정] 셔터 소리 재생 함수 (끊김 방지)
function playShutter() {
    if (shutterSound) {
        shutterSound.pause();
        shutterSound.currentTime = 0; // 항상 처음부터 재생
        shutterSound.play().catch(e => console.log('Sound error:', e));
    }
}

async function initCam(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: 'user' },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    video.play();
    
    initMediaRecorder(stream);
    
  } catch (e){
    console.error(e);
    statusMsg.innerHTML = "🚨 카메라 오류: " + e.message;
  }
}

function initMediaRecorder(stream) {
  const mimeTypes = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'];
  let selectedMimeType = '';
  for (const type of mimeTypes) {
    if (MediaRecorder.isTypeSupported(type)) { selectedMimeType = type; break; }
  }
  if (selectedMimeType) {
    mediaRecorder = new MediaRecorder(stream, { mimeType: selectedMimeType });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  }
}

function startRecording() {
  if (mediaRecorder && mediaRecorder.state === 'inactive') {
    recordedChunks = [];
    mediaRecorder.start();
  }
}

function stopRecording() {
  return new Promise(resolve => {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') { resolve(null); return; }
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
      resolve(blob);
    };
    mediaRecorder.stop();
  });
}

async function waitMsWithCountdown(ms){
  startRecording(); // 영상 녹화 시작
  countdownCircle.classList.add('active');
  
  return new Promise(resolve=>{
    const start = performance.now();
    function tick(now){
      const elapsed = now - start;
      const remain = Math.max(0, ms - elapsed);
      const s = Math.ceil(remain / 1000);
      
      if (s > 0 && s <= 5) countdownNum.textContent = s;
      else countdownNum.textContent = '';
      
      if (remain <= 0) resolve();
      else requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

async function captureAndUpload(){
  const videoBlob = await stopRecording(); // 녹화 종료 및 영상 파일 획득
  
  // 플래시 및 소리
  flashEl.classList.add('active');
  playShutter(); // [수정] 소리 재생
  setTimeout(() => flashEl.classList.remove('active'), 150);
  
  countdownCircle.classList.remove('active');

  // 캔버스 캡처
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const videoRatio = vw / vh;
  let cropW, cropH, sx, sy;

  if (SLOT_RATIO < videoRatio){
    cropH = vh; cropW = cropH * SLOT_RATIO;
    sx = (vw - cropW) / 2; sy = 0;
  } else {
    cropW = vw; cropH = cropW / SLOT_RATIO;
    sx = 0; sy = (vh - cropH) / 2;
  }

  canvas.width = cropW;
  canvas.height = cropH;
  const ctx = canvas.getContext('2d');
  
  ctx.translate(cropW, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, cropW, cropH);
  
  const dataUrl = canvas.toDataURL('image/jpeg', 0.95);

  const formData = new FormData();
  formData.append('data_url', dataUrl);
  if (videoBlob) {
    formData.append('video', videoBlob, 'shot.webm');
  }

  statusMsg.textContent = '저장 중...';
  
  try {
    const res = await fetch("{% url 'upload_capture' %}", {
      method: 'POST',
      headers: { 'X-CSRFToken': CSRF_TOKEN },
      body: formData
    });
    
    if(res.ok) {
      const js = await res.json();
      return { saved: true, count: js.count };
    }
  } catch(e) { console.error(e); }
  return { saved: false };
}

async function autoSequence(){
  await initCam();
  await new Promise(r => setTimeout(r, 1000));

  let taken = 0;
  infoBadge.textContent = `0 / ${SHOT_TOTAL} | 촬영 시작`;

  while (taken < SHOT_TOTAL){
    const currentShot = taken + 1;
    statusMsg.textContent = `촬영 준비`;
    statusMsg.style.color = '#fff';
    infoBadge.textContent = `${currentShot} / ${SHOT_TOTAL}번째 컷`;
    
    await waitMsWithCountdown(CAPTURE_DELAY_MS);
    
    statusMsg.textContent = '찰칵!';
    const result = await captureAndUpload();
    
    if (result.saved) {
      taken = result.count;
    } else {
      statusMsg.textContent = '재시도...';
      await new Promise(r=>setTimeout(r,1000));
      continue;
    }

    if (taken < SHOT_TOTAL) {
      statusMsg.textContent = '다음 포즈 준비하세요!';
      await new Promise(r => setTimeout(r, 2000));
    }
  }

  statusMsg.textContent = '촬영 끝! 사진을 고르러 갑니다.';
  setTimeout(() => {
    window.location.href = "{% url 'preview' %}"; // 혹은 select-frame 등 다음 단계로
  }, 1500);
}

autoSequence();
</script>
{% endblock %}
