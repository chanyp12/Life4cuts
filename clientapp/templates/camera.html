{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
  .camera-page { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #viewContainer { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
  #view { position: relative; width: auto; height: auto; max-width: 100%; max-height: 100%; aspect-ratio: {{ guide_ratio|floatformat:5 }}; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); background: #000; }
  
  #video { width: 100%; height: 100%; object-fit: cover; transform: none; display: block; }
  #video.mirror-active { transform: scaleX(-1); }
  
  .top-badge { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); padding: 10px 25px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); color: #00d1b2; font-size: 24px; font-weight: bold; border-radius: 50px; z-index: 10; border: 2px solid #00d1b2; text-align: center; pointer-events: none; }
  #countdown-circle { position: absolute; bottom: 30px; right: 30px; width: 70px; height: 70px; border-radius: 50%; background: rgba(0, 0, 0, 0.6); border: 4px solid #ffd54f; display: flex; align-items: center; justify-content: center; z-index: 20; opacity: 0; transform: scale(0.8); transition: all 0.3s; }
  #countdown-number { color: #fff; font-size: 32px; font-weight: 800; font-family: sans-serif; }
  #countdown-circle.active { opacity: 1; transform: scale(1); animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 70% { transform: scale(1.05); } 100% { transform: scale(1); } }
  #flash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 30; transition: opacity 0.15s ease-out; }
  #flash.active { opacity: 1; transition: none; }
  #status-msg { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 18px; font-weight: 500; text-shadow: 0 2px 8px rgba(0,0,0,0.8); opacity: 0.9; z-index: 10; }
</style>

<div class="camera-page">
  <div id="viewContainer">
    <div class="top-badge" id="info-badge"><span id="current-shot-num">0</span> / {{ count }}</div>
    <div id="view">
      <video id="video" autoplay playsinline muted></video>
      <div id="countdown-circle"><span id="countdown-number"></span></div>
      <div id="flash"></div>
    </div>
    <div id="status-msg">준비 중...</div>
  </div>
  <canvas id="canvas" style="display:none;"></canvas>
  <audio id="shutterSound" src="/static/sound/shutter.mp3" preload="auto"></audio>
</div>

<script>
const SLOT_RATIO = {{ guide_ratio|floatformat:5 }}; 
const SHOT_TOTAL = {{ count }};
const CAPTURE_DELAY_MS = {{ capture_delay_ms|default:5000 }};
const isMirrorMode = {{ mirror_mode|yesno:"true,false" }};

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const countdownCircle = document.getElementById('countdown-circle');
const countdownNum = document.getElementById('countdown-number');
const statusMsg = document.getElementById('status-msg');
const currentShotNumEl = document.getElementById('current-shot-num');
const flashEl = document.getElementById('flash');
const shutterSound = document.getElementById('shutterSound');

if (isMirrorMode) video.classList.add('mirror-active');

function playShutter() {
    if (shutterSound) {
        const sound = shutterSound.cloneNode();
        sound.volume = 1.0;
        sound.play().catch(e => console.log('Sound blocked:', e));
    }
}

let mediaRecorder;
let recordedChunks = [];
function getCookie(name){
  let value = `; ${document.cookie}`;
  let parts = value.split(`; ${name}=`);
  if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
}
const CSRF_TOKEN = getCookie('csrftoken');

async function initCam(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    statusMsg.innerHTML = "🚨 <b>카메라 오류</b>";
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: 'user' },
      audio: true
    });
    video.srcObject = stream;
    if(shutterSound) shutterSound.load();
    await new Promise(r => video.onloadedmetadata = r);
    video.play();
    initMediaRecorder(stream);
  } catch (e){
    statusMsg.innerHTML = "🚨 <b>카메라 권한 거부됨</b>";
  }
}

function initMediaRecorder(stream) {
  const types = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'];
  let mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  try { mediaRecorder = new MediaRecorder(stream, { mimeType: mime }); } 
  catch (e) { mediaRecorder = new MediaRecorder(stream); }
  mediaRecorder.ondataavailable = (event) => {
    if (event.data.size > 0) recordedChunks.push(event.data);
  };
}

function startRecording() {
  if (mediaRecorder && mediaRecorder.state === 'inactive') {
    recordedChunks = []; mediaRecorder.start();
  }
}

function stopRecording() {
  return new Promise(resolve => {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') { resolve(null); return; }
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
      resolve(blob);
    };
    mediaRecorder.stop();
  });
}

async function waitMsWithCountdown(ms){
  startRecording();
  countdownCircle.classList.add('active');
  return new Promise(resolve=>{
    const start = performance.now();
    function tick(now){
      const elapsed = now - start;
      const remain = Math.max(0, ms - elapsed);
      const s = Math.ceil(remain / 1000);
      
      // [수정] 0보다 크면 무조건 숫자를 보여줌 (6초 이상도 표시)
      if (s > 0) countdownNum.textContent = s; 
      else countdownNum.textContent = '';
      
      if (remain <= 0) resolve(); else requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

async function captureAndUpload(){
  const videoBlob = await stopRecording();
  flashEl.classList.add('active');
  setTimeout(() => flashEl.classList.remove('active'), 150);
  playShutter(); 
  countdownCircle.classList.remove('active');

  const vw = video.videoWidth; const vh = video.videoHeight;
  const videoRatio = vw / vh;
  let cropW, cropH, sx, sy;

  if (SLOT_RATIO < videoRatio){
    cropH = vh; cropW = cropH * SLOT_RATIO;
    sx = (vw - cropW) / 2; sy = 0;
  } else {
    cropW = vw; cropH = cropW / SLOT_RATIO;
    sx = 0; sy = (vh - cropH) / 2;
  }

  canvas.width = cropW; canvas.height = cropH;
  const ctx = canvas.getContext('2d');
  
  if (isMirrorMode) {
      ctx.translate(cropW, 0); ctx.scale(-1, 1);
  }
  
  ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, cropW, cropH);
  
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  const formData = new FormData();
  formData.append('data_url', dataUrl);
  if (videoBlob) formData.append('video', videoBlob, 'shot.webm');

  statusMsg.textContent = '저장 중...'; statusMsg.style.color = '#ffd54f';
  
  try {
    const res = await fetch("{% url 'upload_capture' %}", {
      method: 'POST', headers: { 'X-CSRFToken': CSRF_TOKEN }, body: formData
    });
    if(res.ok) {
      const js = await res.json();
      return { saved: true, count: js.count };
    }
  } catch(e) { console.error(e); }
  return { saved: false };
}

async function autoSequence(){
  await initCam();
  await new Promise(r => setTimeout(r, 1500));
  let taken = 0;
  currentShotNumEl.textContent = '0';

  while (taken < SHOT_TOTAL){
    statusMsg.textContent = `촬영 준비`; statusMsg.style.color = '#fff';
    currentShotNumEl.textContent = (taken + 1);
    await waitMsWithCountdown(CAPTURE_DELAY_MS);
    statusMsg.textContent = '찰칵!';
    const result = await captureAndUpload();
    if (result.saved) { taken = result.count; } 
    else { statusMsg.textContent = '재시도...'; await new Promise(r=>setTimeout(r,1000)); continue; }
    if (taken < SHOT_TOTAL) {
      statusMsg.textContent = '다음 촬영 준비...'; statusMsg.style.color = '#ddd';
      await new Promise(r => setTimeout(r, 1500));
    }
  }
  statusMsg.textContent = '완료! 이동합니다.'; statusMsg.style.color = '#00d1b2';
  setTimeout(() => { window.location.href = "{% url 'preview' %}"; }, 1000);
}
autoSequence();
</script>
{% endblock %}
