{% extends 'base.html' %}
{% block content %}
<style>
    /* 전체 레이아웃 */
    .preview-page {
        width: 100vw;
        height: 100vh;
        background-color: #222;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
    }

    /* [수정] 결과 이미지 컨테이너: 흰색 배경 강제 */
    #result-container {
        position: relative;
        background-color: #ffffff !important; /* 투명 배경 방지 */
        padding: 10px; /* 액자 느낌 테두리 */
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        z-index: 10;
        max-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #final-image {
        display: block;
        max-height: 75vh;
        width: auto;
        object-fit: contain;
    }

    .btn-group {
        margin-top: 30px;
        display: flex;
        gap: 20px;
        z-index: 20;
    }

    .btn {
        padding: 15px 40px;
        font-size: 20px;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: transform 0.2s;
    }
    .btn-print { background-color: #00d1b2; color: white; }
    .btn-home { background-color: #ff6b6b; color: white; }
    .btn:active { transform: scale(0.95); }
</style>

<div class="preview-page">
    <h1>완성된 사진</h1>
    
    <div id="result-container">
        <img id="final-image" src="{{ final_image_url }}" alt="인생네컷 결과">
    </div>

    <div class="btn-group">
        <button class="btn btn-home" onclick="location.href='/'">처음으로</button>
        <button class="btn btn-print" onclick="window.print()">🖨 인쇄하기</button>
    </div>
</div>
{% endblock %}
