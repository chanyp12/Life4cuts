{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>인생네컷</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* 페이지 전체 스크롤 금지 */
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app-root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: #00d1b2;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #444;
      color: #fff;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div id="app-root">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
